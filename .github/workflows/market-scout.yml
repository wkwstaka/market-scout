
name: Daily market evidence collection

on:
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect market evidence
        run: python market_scout_v07_iphone/scout.py
      - name: Commit updated research
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_scout_v07_iphone/data/research.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market research data"
            git push
          fi
      
